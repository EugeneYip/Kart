<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05070f" />
    <title>APEX KART</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

      /* Boot screen — replaced by the real menu once Engine reports ready */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: radial-gradient(ellipse at 50% 40%, #131c33 0%, #05070f 70%);
        transition: opacity 0.6s ease; color: #cfe3ff;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        font-size: clamp(38px, 8vw, 96px); letter-spacing: 0.22em; font-weight: 800;
        background: linear-gradient(180deg, #fff 0%, #7fb6ff 55%, #2b6fd6 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 0 60px rgba(90, 160, 255, 0.35);
      }
      #boot-bar { width: min(420px, 70vw); height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
      #boot-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #48d6ff, #7f8cff); transition: width 0.25s ease; box-shadow: 0 0 14px #48d6ff; }
      #boot-msg { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>APEX KART</h1>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-msg">Initializing</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
