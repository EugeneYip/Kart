<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05070f" />
    <title>Foxy Kart</title>

    <!--
      FAVICON — inline SVG data URI. A tyre ring over the boot screen's gold,
      legible as a mark at 16 px. A data URI rather than a file so AGENTS.md
      rule 3 stays literally true — zero network requests, nothing to 404 — and
      so `dist/` stays exactly four asset files.

      WHAT THIS DOES AND DOES NOT FIX — measured, not assumed.
      With no icon declared, the static subpath rehearsal logged one
      `404 /favicon.ico` on every single page load. Browsers probe for an icon at
      the ORIGIN ROOT, never at the page's own directory, so on Pages that request
      is `https://<user>.github.io/favicon.ico`. That path is OUTSIDE this
      project's published subtree: `base` cannot redirect it and no file this
      repository ships can answer it. Only the owner's user site — the separate
      `<user>.github.io` repository — owns that URL. So the residual 404 is
      structurally unfixable from here, and it is harmless: it is a browser
      convenience request for a decoration, not an app asset, and the game never
      reads it.

      Declaring the icon does reduce the probe rather than eliminate it. Measured
      over three forced reloads of the built site: two loads made no `/favicon.ico`
      request at all, one still did. So do NOT read a stray `404 /favicon.ico` in
      a network panel as a deployment fault — check that the five real requests
      (index.html + 3 JS + 1 CSS) are all 200, which is the actual contract.

      The attributes are all load-bearing, and each was needed before Chrome
      would accept the icon at all: `type="image/svg+xml"` (without it Chrome
      does not commit to an SVG icon), explicit `width`/`height` on the <svg>
      (a viewBox alone leaves the image intrinsically sizeless — it measured
      150x150), and `%20` for spaces (literal spaces are not legal in a URI).
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='32'%20height='32'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2305070f'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='9.5'%20fill='none'%20stroke='%23ffd166'%20stroke-width='4'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='3'%20fill='%23f2901f'/%3E%3C/svg%3E"
    />
    <!--
      ===================================================================
       BOOT SCREEN — typographic
      ===================================================================
       WHY THERE IS NO CHARACTER ART HERE ANY MORE
       A previous revision drew Foxy and Capy as two hand-authored inline
       SVG busts. They were authored blind — written as path data without
       ever being rendered — and the owner's verdict on seeing them was
       "really ugly, almost unbearable". Rule 3 of AGENTS.md forbids a
       static image, and a bust good enough to lead the game cannot be
       hand-written in path data on the first try. So the boot screen is
       now purely typographic: a logotype, a subtitle, a progress bar and
       a status line. Restrained and correct beats ambitious and crude.
       The 3-D characters introduce themselves on the racer-select screen,
       where they are rendered from the real rigs (`src/karts/Portrait.ts`).

       WHY IT IS STILL PLAIN HTML + CSS, WITH NO SCRIPT
       The boot screen must render, and must keep showing status, even when
       the 3-D never starts. A previous defect had the page sit at
       "Initializing" forever because `requestAnimationFrame` does not fire
       at a 0x0 viewport, and anything depending on the module graph, WebGL
       or rAF would have gone down with it. Everything below is painted by
       the parser before it reaches `main.ts`, and stays painted whatever
       happens next. No <img>, no canvas, no fetch, no script — which also
       satisfies AGENTS.md rule 3 (procedural, zero network requests).

       NO DECORATIVE OVERLAYS — this is a bug fix, not a preference.
       The owner also reported "weird lines in the text": faint diagonal
       hairlines across the logotype. Four things in the old markup could
       produce them and all four are gone:
         1. a `repeating-conic-gradient` light-ray backdrop on #boot::before,
            rotating behind the text and crossing it at every angle;
         2. a second full-bleed haze overlay on #boot::after;
         3. `-webkit-text-stroke` on `background-clip: text` glyphs, whose
            stroke antialiases against a transparent fill and leaves seams;
         4. `drop-shadow(0 3px 0 ...)` — a hard-edged, zero-blur duplicate
            of the glyphs that shows through the antialiased fringe of
            diagonal strokes (K, A, Y, R) as exactly such a hairline.
       Nothing is painted on top of, or immediately behind, the type now.
       The only backdrop is #boot's own background, which the browser paints
       below every child by definition.

       THE BOOT CONTRACT `src/main.ts` DEPENDS ON — do not rename:
         #app        the render host
         #boot       the overlay; gets `.hidden`, then removed
         #boot-bar   the progress track
         #boot-fill  progress fill; `style.width` is written as a %
         #boot-msg   status line; `textContent` is written
       Animation is CSS-only and decorative; the logotype, the bar and the
       status line are all legible with animation disabled.
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

      /* ---- Boot overlay ------------------------------------------------
         Two stacked radial washes plus the base colour: a warm pool behind
         the logotype over a cooler field. This is #boot's OWN background,
         so it is painted beneath every child and can never streak the type.
      */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 52% 34% at 50% 44%, rgba(255, 168, 74, 0.16) 0%, rgba(255, 168, 74, 0) 70%),
          radial-gradient(ellipse 78% 62% at 50% 42%, #1b2748 0%, #0a1024 58%, #05070f 100%);
        transition: opacity 0.6s ease; color: #cfe3ff;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }

      /* ---- Logotype ---------------------------------------------------- */
      .boot-logo {
        text-align: center;
        display: flex; flex-direction: column; align-items: center;
        gap: clamp(8px, 1.4vh, 16px);
      }
      #boot h1 {
        font-size: clamp(34px, 8.2vw, 104px); letter-spacing: 0.17em; font-weight: 900;
        line-height: 1.02; text-indent: 0.17em; /* balance the trailing letter-space */
        /* A solid warm gold is the BASE, not a fallback afterthought: if
           background-clip:text is unavailable the wordmark still reads. */
        color: #ffcf6d;
      }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        #boot h1 {
          background: linear-gradient(180deg, #fff6dd 0%, #ffd166 44%, #f2901f 76%, #c2610d 100%);
          -webkit-background-clip: text; background-clip: text;
          color: transparent;
          /* Soft, blurred depth only. No zero-blur offsets, no text stroke. */
          filter:
            drop-shadow(0 2px 4px rgba(48, 20, 4, 0.55))
            drop-shadow(0 0 30px rgba(255, 172, 62, 0.28));
        }
      }

      /* Subtitle, flanked by two rules that grow out of it. Flex siblings —
         nothing overlaps the text. */
      .boot-logo__sub {
        display: flex; align-items: center; justify-content: center;
        gap: clamp(10px, 1.6vw, 20px);
        font-size: clamp(9px, 1.5vw, 14px); font-weight: 700;
        letter-spacing: 0.5em; text-indent: 0.5em; color: #9fc0ef;
        text-transform: uppercase;
      }
      .boot-logo__sub::before, .boot-logo__sub::after {
        content: ""; display: block; height: 1px; width: clamp(18px, 6vw, 74px);
        background: linear-gradient(90deg, rgba(159, 192, 239, 0) 0%, rgba(159, 192, 239, 0.55) 100%);
      }
      .boot-logo__sub::after { transform: scaleX(-1); }

      /* ---- Progress ---------------------------------------------------- */
      #boot-bar {
        position: relative; width: min(430px, 62vw); height: 8px;
        margin-top: clamp(22px, 5vh, 54px);
        background: rgba(255, 255, 255, 0.09); border-radius: 5px; overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      #boot-fill {
        height: 100%; width: 0%; border-radius: 5px;
        background: linear-gradient(90deg, #ffb347, #ffd98a 45%, #48d6ff);
        transition: width 0.25s ease; box-shadow: 0 0 14px rgba(255, 179, 71, 0.8);
      }
      /* Indeterminate sweep: proof of life before the first progress event,
         and it needs no JS clock. Clipped inside the bar, far from the type. */
      #boot-bar::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(
          100deg, transparent 20%, rgba(255, 255, 255, 0.5) 50%, transparent 80%
        );
        transform: translateX(-100%);
        animation: boot-sweep 1.5s ease-in-out infinite;
      }
      @keyframes boot-sweep { to { transform: translateX(100%); } }

      #boot-msg {
        margin-top: clamp(10px, 1.8vh, 18px);
        font-size: clamp(10px, 1.3vw, 12px); letter-spacing: 0.2em; text-transform: uppercase;
        opacity: 0.68; min-height: 1.2em; text-align: center;
      }

      /* Tight viewports (the 800x450 review pane): pull the stack together. */
      @media (max-height: 470px) {
        #boot-bar { margin-top: 20px; }
        #boot h1 { font-size: clamp(30px, 6.6vw, 60px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
        #boot-bar::after { animation: none; }
        #boot-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="boot">
      <div class="boot-logo">
        <h1>FOXY KART</h1>
        <div class="boot-logo__sub">Grand Prix</div>
      </div>

      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-msg" role="status" aria-live="polite">Initializing</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
