<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX KART — Material Lab</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #06070b; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font-size: 11px; line-height: 1.55; color: #b9d4ff;
        background: rgba(6, 9, 16, 0.72); border: 1px solid rgba(120, 170, 255, 0.22);
        border-radius: 8px; padding: 10px 13px; letter-spacing: 0.02em;
        backdrop-filter: blur(6px); pointer-events: none; min-width: 250px;
      }
      #hud b { color: #eaf3ff; font-weight: 600; letter-spacing: 0.09em; }
      #hud .k { color: #ffd98a; }
      #hud .d { color: #6f88ad; }
      #hud hr { border: 0; border-top: 1px solid rgba(120, 170, 255, 0.16); margin: 7px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">booting…</div>
    <script type="module" src="/src/dev/textures.ts"></script>
  </body>
</html>
