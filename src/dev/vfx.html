<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOXY KART — VFX Harness</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070f; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      .panel {
        position: fixed; z-index: 10;
        background: rgba(6, 10, 20, 0.78);
        border: 1px solid rgba(120, 180, 255, 0.22);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 11px; line-height: 1.5;
        backdrop-filter: blur(6px);
        white-space: pre;
      }
      #hud { top: 12px; left: 12px; min-width: 290px; }
      #keys { bottom: 12px; left: 12px; opacity: 0.85; }
      #last {
        top: 12px; left: 50%; transform: translateX(-50%);
        font-size: 16px; letter-spacing: 0.08em; text-align: center;
        color: #fff; min-width: 220px;
      }
      b { color: #7fe6ff; font-weight: 600; }
      /* Vite's HMR error overlay is project-wide; other agents' broken modules
         would otherwise cover this harness. Errors still go to the console. */
      vite-error-overlay { display: none !important; }
      .warn { color: #ffd166; }
      .ok { color: #6ef08a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="panel" id="hud">booting…</div>
    <div class="panel" id="last">VFX HARNESS</div>
    <div class="panel" id="keys"></div>
    <script type="module" src="/src/dev/vfx.ts"></script>
  </body>
</html>
