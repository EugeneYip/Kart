<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX KART — World Lab</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #06070b; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font-size: 11px; line-height: 1.6; color: #b9d4ff;
        background: rgba(6, 9, 16, 0.7); border: 1px solid rgba(120, 170, 255, 0.22);
        border-radius: 8px; padding: 10px 13px; letter-spacing: 0.02em;
        backdrop-filter: blur(6px); pointer-events: none; min-width: 268px;
        white-space: pre;
      }
      #hud b { color: #eaf3ff; font-weight: 600; letter-spacing: 0.08em; }
      #hud .k { color: #ffd98a; }
      #hud .d { color: #6f88ad; }
      #keys {
        position: fixed; right: 12px; top: 12px; z-index: 10;
        font-size: 10.5px; line-height: 1.6; color: #8fb0d8;
        background: rgba(6, 9, 16, 0.62); border: 1px solid rgba(120, 170, 255, 0.16);
        border-radius: 8px; padding: 9px 12px; pointer-events: none; white-space: pre;
      }
      #keys span { color: #ffd98a; }
      #boot {
        position: fixed; inset: 0; z-index: 20; display: flex;
        align-items: center; justify-content: center; color: #9fc0e8;
        background: #06070b; font-size: 13px; letter-spacing: 0.16em;
        transition: opacity .4s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">booting…</div>
    <div id="keys"></div>
    <div id="boot">BAKING WORLD…</div>
    <script type="module" src="/src/dev/world.ts"></script>
  </body>
</html>
