<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>APEX KART — kart & character bench</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d16; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        padding: 10px 14px; border-radius: 8px;
        background: rgba(6, 10, 20, 0.72);
        border: 1px solid rgba(120, 170, 255, 0.22);
        color: #cfe3ff; font-size: 12px; line-height: 1.55;
        white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000;
        min-width: 300px;
      }
      #hud b { color: #7fd7ff; font-weight: 600; }
      #help {
        position: fixed; bottom: 12px; left: 12px; z-index: 10; color: #7d90ad;
        font-size: 11px; line-height: 1.6; white-space: pre;
      }
      /* Portrait strip: KartManager.renderPortrait() for the whole roster, so
         the one thing a headless probe cannot check — how a bust actually
         looks — is one keypress and one screenshot away. */
      #portraits {
        position: fixed; right: 12px; top: 12px; bottom: 12px; z-index: 11;
        display: none; grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: min-content; gap: 8px; overflow: auto;
        padding: 10px; border-radius: 10px;
        background: rgba(6, 10, 20, 0.86);
        border: 1px solid rgba(120, 170, 255, 0.22);
      }
      #portraits.on { display: grid; }
      #portraits figure { margin: 0; text-align: center; }
      #portraits canvas, #portraits .miss {
        width: 148px; height: 148px; display: block; border-radius: 8px;
        background: #11172a; border: 1px solid rgba(140, 190, 255, 0.25);
      }
      #portraits .miss { color: #ff9a9a; font-size: 10px; line-height: 148px; }
      #portraits figcaption { color: #cfe3ff; font-size: 10px; padding-top: 3px; }
      #portraits .ndc { color: #7d90ad; font-size: 9px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">booting…</div>
    <div id="portraits"></div>
    <div id="help">[ ] cycle racer    A all-racers row    T turntable
1 front 3/4   2 rear 3/4   3 side   4 low chase   5 top
D drift   B boost   X spin-out   Z squash   H hop   F finish   G ghost
L cycle LOD   R roll (fake corner)   S speed up/down (, .)   W wireframe
P portrait strip (all ten select-screen busts)</div>
    <!--
      DEV HARNESS ONLY. Twelve agents share this dev server, so vite fires a
      full-reload every time any of them saves — which restarts a five-second
      procedural asset build and means this page never finishes booting.
      Stubbing WebSocket keeps the HMR client from ever hearing about it.
      Reload by hand (or with ?v=N) to pick up changes.
    -->
    <script>
      window.WebSocket = class DeadSocket {
        constructor() { this.readyState = 3; }
        addEventListener() {}
        removeEventListener() {}
        send() {}
        close() {}
      };
    </script>
    <script type="module" src="/src/dev/karts.ts"></script>
  </body>
</html>
