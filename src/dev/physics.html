<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FOXY KART — physics bench</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d16; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        padding: 10px 14px; border-radius: 8px;
        background: rgba(6, 10, 20, 0.72);
        border: 1px solid rgba(120, 170, 255, 0.22);
        color: #cfe3ff; font-size: 12px; line-height: 1.5;
        white-space: pre; pointer-events: none;
        text-shadow: 0 1px 2px #000;
        min-width: 300px;
      }
      #hud b { color: #7fd7ff; font-weight: 600; }
      #bars { position: fixed; top: 12px; right: 12px; z-index: 10; width: 190px; }
      .row { margin-bottom: 6px; color: #9fb6d8; font-size: 11px; }
      .track { height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-top: 2px; }
      .fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.05s linear; }
      #help {
        position: fixed; bottom: 12px; left: 12px; z-index: 10; color: #7d90ad; font-size: 11px;
        line-height: 1.6; white-space: pre;
      }
      #results {
        position: fixed; inset: 6% 12%; z-index: 20; display: none; overflow: auto;
        padding: 20px 24px; border-radius: 10px; background: rgba(4, 7, 14, 0.95);
        border: 1px solid rgba(120, 170, 255, 0.3); color: #d7e6ff; font-size: 12px;
        line-height: 1.55; white-space: pre;
      }
      #results.on { display: block; }
      .pass { color: #62e08a; }
      .fail { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">booting…</div>
    <div id="bars"></div>
    <div id="help">W/↑ accel   S/↓ brake   A D / ← → steer   SPACE or SHIFT drift+hop
R reset   P pause   C cycle chassis   B boost   K spin-out   T run test suite   Esc close</div>
    <div id="results"></div>
    <script type="module" src="/src/dev/physics.ts"></script>
  </body>
</html>
