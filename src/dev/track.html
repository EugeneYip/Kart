<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FOXY KART — track bench</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07090f; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      .panel {
        position: fixed; z-index: 10;
        background: rgba(6, 10, 20, 0.76);
        border: 1px solid rgba(120, 180, 255, 0.22);
        border-radius: 10px; padding: 10px 13px;
        font-size: 11px; line-height: 1.55; white-space: pre;
        backdrop-filter: blur(6px);
      }
      #hud { top: 12px; left: 12px; min-width: 330px; }
      #keys { bottom: 12px; left: 12px; opacity: 0.82; }
      #bench { top: 12px; right: 12px; min-width: 300px; max-height: 70vh; overflow: auto; }
      b { color: #7fe6ff; font-weight: 600; }
      .ok { color: #6ef08a; }
      .bad { color: #ff7b6b; }
      .warn { color: #ffd166; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="panel" id="hud">booting…</div>
    <div class="panel" id="bench">press <b>B</b> to benchmark raycastGround</div>
    <div class="panel" id="keys"></div>
    <script type="module" src="/src/dev/track.ts"></script>
  </body>
</html>
