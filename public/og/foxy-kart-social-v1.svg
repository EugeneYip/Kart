<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Foxy Kart social preview</title>
  <desc id="desc">Foxy Kart Grand Prix browser racing game</desc>
  <defs>
    <radialGradient id="bgA" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#223766"/>
      <stop offset="0.58" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dd"/>
      <stop offset="0.42" stop-color="#ffd166"/>
      <stop offset="0.76" stop-color="#f2901f"/>
      <stop offset="1" stop-color="#c2610d"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48d6ff" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#48d6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgA)"/>
  <ellipse cx="820" cy="240" rx="410" ry="270" fill="#ffad3f" opacity="0.08"/>
  <ellipse cx="245" cy="120" rx="260" ry="220" fill="#48d6ff" opacity="0.06"/>

  <path d="M-80 620 C180 470 318 430 520 462 C730 495 788 378 930 326 C1050 282 1160 305 1280 360" fill="none" stroke="#08101f" stroke-width="118" stroke-linecap="round"/>
  <path d="M-80 620 C180 470 318 430 520 462 C730 495 788 378 930 326 C1050 282 1160 305 1280 360" fill="none" stroke="url(#track)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M-80 620 C180 470 318 430 520 462 C730 495 788 378 930 326 C1050 282 1160 305 1280 360" fill="none" stroke="#cfe3ff" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="18 28"/>

  <g transform="translate(900 132)">
    <rect width="245" height="245" rx="54" fill="#091121" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M70 86 93 45l29 29 30-29 23 41" fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="122" cy="138" r="58" fill="none" stroke="url(#gold)" stroke-width="17"/>
    <circle cx="122" cy="138" r="18" fill="#48d6ff"/>
  </g>

  <text x="92" y="190" fill="#9fc0ef" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="12">GRAND PRIX</text>
  <text x="84" y="302" fill="url(#gold)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="104" font-weight="900" letter-spacing="13">FOXY KART</text>
  <text x="92" y="365" fill="#d8e7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="600">Browser kart racing across stylized city circuits</text>
  <text x="92" y="414" fill="#8faad2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">Desktop · Phone · Tablet</text>
  <text x="92" y="552" fill="#8faad2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" letter-spacing="2">kart.eugeneyip.com</text>
